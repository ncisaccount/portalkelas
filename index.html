<!DOCTYPE html>
<html lang="id">

  <link rel="manifest" href="./manifest.json">

  <!-- Terapkan tema tersimpan sebelum render agar tidak berkedip -->

  </script>

    </div>
    <div id="views"></div>

  <nav id="bnav" aria-label="Navigasi bawah"></nav>
